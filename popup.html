<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Obsidian Highlight Clipper</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <h1>Obsidian Highlight Clipper</h1>
      <p class="shortcut">macOS: Control + Shift + H<br><span>Windows/Linux: Alt + Shift + H</span></p>
      <fieldset>
        <legend>Save location</legend>
        <label><input type="radio" name="saveMode" value="daily">Daily note</label>
        <label><input type="radio" name="saveMode" value="custom">Custom file</label>
        <input id="customFile" placeholder="Inbox/Web Highlights.md">
      </fieldset>
      <fieldset>
        <legend>Sidebar appearance</legend>
        <div class="theme-options">
          <label class="theme-choice"><input type="radio" name="panelTheme" value="sand"><span class="theme-swatch theme-sand"></span>Sand</label>
          <label class="theme-choice"><input type="radio" name="panelTheme" value="light"><span class="theme-swatch theme-light"></span>Light</label>
          <label class="theme-choice"><input type="radio" name="panelTheme" value="dusk"><span class="theme-swatch theme-dusk"></span>Dark</label>
        </div>
      </fieldset>
      <label class="source"><input id="includeSource" type="checkbox">Include source link</label>
      <div class="actions"><button id="save" class="primary" type="button">Save settings</button><button id="openOptions" type="button">More settings</button></div>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
