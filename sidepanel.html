<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Highlight Clipper</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main id="panel" data-theme="auto">
      <header class="header">
        <h1><span id="titleLabel">Clip queue</span> <span id="count"></span></h1>
        <div class="header-actions"><button id="settings" type="button" aria-label="Settings" title="Settings">⚙</button></div>
      </header>
      <button id="mode" class="mode" type="button" title="Toggle selection mode"><span id="modeLabel">Selection mode</span><span class="switch"><i id="modeOn">On</i><i id="modeOff">Off</i></span></button>
      <ul id="list"></ul>
      <footer>
        <button id="save" class="primary" type="button">Save to Obsidian</button>
        <button id="copy" class="primary" type="button">Copy</button>
        <button id="clear" type="button">Clear all</button>
      </footer>
    </main>
    <script src="clip-queue.js"></script>
    <script src="obsidian-uri.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
