<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Obsidian Highlighter 设置</title><link rel="stylesheet" href="options.css"></head>
  <body>
    <main>
      <h1>Obsidian Highlighter</h1>
      <p>剪藏内容会复制为 Markdown；粘贴至指定 Obsidian 笔记即可。</p>
      <label>默认笔记位置<input id="notePath" placeholder="例如：Inbox/Web Highlights"></label>
      <label class="checkbox"><input id="includeSource" type="checkbox">携带原文链接</label>
      <button id="save" type="button">保存设置</button><span id="status" role="status"></span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
