<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Obsidian Highlight Clipper Settings</title><link rel="stylesheet" href="options.css"></head>
  <body>
    <main>
      <h1>Obsidian Highlight Clipper</h1>
      <p id="intro">Saving appends all highlights from the current page to the selected note.</p>
      <label class="language"><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="zh-CN">中文</option></select></label>
      <fieldset>
        <legend id="saveLocationLegend">Save location</legend>
        <label class="radio"><input type="radio" name="saveMode" value="daily"><span id="dailyLabel">Obsidian daily note</span></label>
        <label class="radio"><input type="radio" name="saveMode" value="custom"><span id="customLabel">Custom file</span></label>
        <label><span id="vaultNameLabel">Vault name or path</span><input id="vaultName" placeholder="e.g. My Vault or /Users/me/Documents/My Vault"><small id="vaultNameHint">Required for custom file paths. Use a vault name, or its absolute local path.</small></label>
        <label id="customFileField"><span id="filePathLabel">File path</span><input id="customFile" placeholder="e.g. Inbox/{{YYYY/MM/DD}} Highlights.md"><small id="tokensHint">Supported: {{YYYY}}, {{MM}}, {{DD}}, {{YYYY-MM-DD}}, {{YYYY/MM/DD}}</small></label>
        <label class="checkbox"><input id="includeSource" type="checkbox"><span id="sourceLabel">Include source link</span></label>
      </fieldset>
      <fieldset>
        <legend id="highlightLegend">Highlight appearance</legend>
        <label class="radio"><input type="radio" name="highlightStyle" value="background"><span id="backgroundHighlightLabel">Background</span></label>
        <label class="radio"><input type="radio" name="highlightStyle" value="underline"><span id="underlineHighlightLabel">Underline</span></label>
        <div id="underlineColorField" class="color-field"><span id="underlineColorLabel">Underline color</span><div class="color-options" role="radiogroup" aria-label="Underline color"><label><input type="radio" name="underlineColor" value="#ef4444"><span class="color-swatch red"></span></label><label><input type="radio" name="underlineColor" value="#fb7185"><span class="color-swatch pink"></span></label><label><input type="radio" name="underlineColor" value="#a78bfa"><span class="color-swatch purple"></span></label><label><input type="radio" name="underlineColor" value="#60a5fa"><span class="color-swatch blue"></span></label><label><input type="radio" name="underlineColor" value="#5dcc7a"><span class="color-swatch green"></span></label><label><input type="radio" name="underlineColor" value="#fbbf69"><span class="color-swatch orange"></span></label></div></div>
      </fieldset>
      <fieldset>
        <legend id="appearanceLegend">Sidebar appearance</legend>
        <label class="radio"><input type="radio" name="panelTheme" value="auto"><span id="autoThemeLabel">Follow browser</span></label>
        <label class="radio"><input type="radio" name="panelTheme" value="sand"><span id="sandThemeLabel">Sand</span></label>
        <label class="radio"><input type="radio" name="panelTheme" value="light"><span id="lightThemeLabel">Light</span></label>
        <label class="radio"><input type="radio" name="panelTheme" value="dusk"><span id="darkThemeLabel">Dark</span></label>
      </fieldset>
      <button id="save" type="button">Save settings</button><span id="status" role="status"></span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
